<!DOCTYPE html>
<html>
<head>
    <title>SlabStrikers</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0a0a0f;
            color: white;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        h1 {
            padding: 12px 0 6px;
            font-size: 1.6rem;
            letter-spacing: 3px;
            color: #e0e0ff;
            text-shadow: 0 0 12px rgba(120,100,255,0.8);
        }
        #statusBar {
            font-size: 0.85rem;
            color: #aaa;
            min-height: 20px;
            margin-bottom: 4px;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
        }

        /* Login screen */
        #loginScreen {
            margin-top: 80px;
        }
        #loginScreen input {
            padding: 10px 16px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #444;
            background: #1a1a2e;
            color: white;
            outline: none;
            width: 220px;
        }
        #loginScreen input:focus { border-color: #7060ff; }
        #loginScreen button {
            padding: 10px 20px;
            margin-left: 8px;
            font-size: 1rem;
            border-radius: 8px;
            background: #5040cc;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        #loginScreen button:hover { background: #6050ee; }
        #joinError {
            color: #ff6060;
            margin-top: 10px;
            font-size: 0.9rem;
            min-height: 20px;
        }

        /* Mobile controls */
        .control-btn {
            width: 80px;
            height: 80px;
            font-size: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.4);
            color: white;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.1s;
        }
        .control-btn:active { background: rgba(255,255,255,0.35); }
        #mobileControls {
            display: none;
            position: fixed;
            bottom: 20px;
            width: 100%;
            justify-content: space-between;
            padding: 0 50px;
        }
    </style>
</head>
<body>
    <h1>⚡ SlabStrikers Arena</h1>
    <div id="statusBar"></div>

    <div id="loginScreen">
        <input id="roomInput" type="text" placeholder="Enter Room Name" maxlength="20">
        <button onclick="joinGame()">Join Game</button>
        <div id="joinError"></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600" style="display:none;"></canvas>

    <div id="mobileControls">
        <button id="btnLeft" class="control-btn">⬅️</button>
        <button id="btnRight" class="control-btn">➡️</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusBar = document.getElementById('statusBar');

        let mySocketId = null;
        socket.on('connect', () => { mySocketId = socket.id; });

        // ── Maintenance ──────────────────────────────────────────────
        socket.on('maintenance', () => {
            document.body.innerHTML = `
                <h1 style="color:#ff4444;margin-top:20%">⚠️ UNDER MAINTENANCE ⚠️</h1>
                <p style="margin-top:12px;color:#aaa">We'll be back soon. Please check back later!</p>
            `;
        });

        // ── Join flow ─────────────────────────────────────────────────
        function joinGame() {
            const roomName = document.getElementById('roomInput').value.trim();
            document.getElementById('joinError').textContent = '';
            if (!roomName) {
                document.getElementById('joinError').textContent = 'Please enter a room name.';
                return;
            }
            socket.emit('joinRoom', roomName);
        }

        // Allow Enter key to join
        document.getElementById('roomInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') joinGame();
        });

        socket.on('joinError', (msg) => {
            document.getElementById('joinError').textContent = msg;
        });

        socket.on('joinSuccess', () => {
            document.getElementById('loginScreen').style.display = 'none';
            canvas.style.display = 'block';
            // Show mobile controls only on touch devices
            if ('ontouchstart' in window) {
                document.getElementById('mobileControls').style.display = 'flex';
            }
        });

        socket.on('waitingForPlayer', () => {
            statusBar.textContent = '⏳ Waiting for opponent to join...';
            drawWaitingScreen();
        });

        socket.on('gameStart', () => {
            statusBar.textContent = '🎮 Game started!';
        });

        socket.on('playerLeft', () => {
            statusBar.textContent = '⚠️ Opponent disconnected. Waiting for new player...';
            drawWaitingScreen();
        });

        socket.on('gameOver', (winnerId) => {
            const isWinner = winnerId === mySocketId;
            const resultMsg = isWinner ? '🏆 YOU WIN!' : '💀 YOU LOSE!';
            
            statusBar.innerHTML = `<span style="color: ${isWinner ? '#00ff88' : '#ff4444'};">${resultMsg} Restarting in a few seconds...</span>`;
            
            // Draw a big overlay on the canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.shadowBlur = 15;
            ctx.shadowColor = isWinner ? '#00ff88' : '#ff4444';
            ctx.fillStyle = isWinner ? '#aaffcc' : '#ffaaaa';
            ctx.font = 'bold 50px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText(resultMsg, canvas.width / 2, canvas.height / 2 + 15);
            ctx.shadowBlur = 0; // Reset shadow
        });

        // ── Keyboard input with held-key support ──────────────────────
        const keysHeld = {};
        document.addEventListener('keydown', (e) => { keysHeld[e.code] = true; });
        document.addEventListener('keyup', (e) => { keysHeld[e.code] = false; });

        setInterval(() => {
            if (keysHeld['ArrowLeft']) socket.emit('playerInput', 'left');
            if (keysHeld['ArrowRight']) socket.emit('playerInput', 'right');
        }, 16);

        // ── Mobile controls ───────────────────────────────────────────
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');

        let mobileInterval = null;
        function startMobileMove(dir) {
            socket.emit('playerInput', dir);
            mobileInterval = setInterval(() => socket.emit('playerInput', dir), 16);
        }
        function stopMobileMove() {
            clearInterval(mobileInterval);
            mobileInterval = null;
        }

        ['mousedown', 'touchstart'].forEach(evt => {
            btnLeft.addEventListener(evt, (e) => { e.preventDefault(); startMobileMove('left'); });
            btnRight.addEventListener(evt, (e) => { e.preventDefault(); startMobileMove('right'); });
        });
        ['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(evt => {
            btnLeft.addEventListener(evt, stopMobileMove);
            btnRight.addEventListener(evt, stopMobileMove);
        });

        // ── Render ────────────────────────────────────────────────────
        function drawWaitingScreen() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.font = '24px Segoe UI';
            ctx.textAlign = 'center';
            ctx.fillText('Waiting for opponent...', canvas.width / 2, canvas.height / 2);
        }

        socket.on('updateState', (gameState) => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw centre dashed line
            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw scores
            const scoreEntries = Object.entries(gameState.scores || {});
            if (scoreEntries.length > 0) {
                ctx.font = 'bold 28px Segoe UI';
                ctx.textAlign = 'center';
                // Top player score (y < 300) shown in upper half
                // Bottom player score (y >= 300) shown in lower half
                const players = gameState.players;
                scoreEntries.forEach(([id, score]) => {
                    const p = players[id];
                    if (!p) return;
                    const isTop = p.y < 300;
                    const scoreY = isTop ? canvas.height / 2 - 20 : canvas.height / 2 + 40;
                    const isMe = (id === mySocketId);
                    ctx.fillStyle = isMe ? 'rgba(120,200,255,0.7)' : 'rgba(255,255,255,0.4)';
                    ctx.fillText(score, canvas.width / 2, scoreY);
                });
            }

            // Draw paddles with glow
            const players = gameState.players;
            for (let id in players) {
                const p = players[id];
                const isMe = (id === mySocketId);
                ctx.shadowColor = isMe ? '#7080ff' : '#ff7060';
                ctx.shadowBlur = 12;
                ctx.fillStyle = isMe ? '#a0b0ff' : '#ff9080';
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.width, p.height, 6);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Draw ball with glow
            const ball = gameState.ball;
            if (ball) {
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 16;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.roundRect(ball.x, ball.y, ball.width, ball.height, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        });
    </script>
</body>
</html>
